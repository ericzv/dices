# ---------------------------------------------------------------------------
# Configuracao do pacote TabNet do Cardputer ADV.
# Editar aqui e rodar  python3 tools/build_pack.py  para gerar tabnet.pack
# ---------------------------------------------------------------------------

extracao: "2026-09-19"        # data em que os CSVs foram baixados do TabNet
competencia_minima: 202501    # tudo anterior a isso e descartado

# ---------------------------------------------------------------------------
# AMB - producao ambulatorial (SIA)
# valor: R$ por procedimento, tabela SIGTAP, aplicado a toda a serie
# ---------------------------------------------------------------------------
amb_procedimentos:
  - codigo: "0405030045"
    abrev:  "Foto"
    nome:   "Fotocoagulacao a laser"
    valor:  645.66
  - codigo: "0405030193"
    abrev:  "Pan-foto"
    nome:   "Pan-fotocoagulacao de retina a laser"
    valor:  860.92
  - codigo: "0211060178"
    abrev:  "Retinografia"
    nome:   "Retinografia colorida binocular"
    valor:  24.68
  - codigo: "0211060283"
    abrev:  "OCT"
    nome:   "Tomografia de coerencia optica"
    valor:  48.00
  - codigo: "0303050233"
    abrev:  "Injecoes"
    nome:   "Tratamento medicamentoso de doenca da retina"
    valor:  1881.84

amb_grupos:
  - abrev: "Laser retina"
    nome:  "Laser em retina (Foto + Pan-foto)"
    codigos: ["0405030045", "0405030193"]
  - abrev: "Imagem retina"
    nome:  "Imagem de retina (Retinografia + OCT)"
    codigos: ["0211060178", "0211060283"]

# ---------------------------------------------------------------------------
# VVPP - vitrectomia posterior (SIH), tratada como procedimento unico.
# Os tres codigos ja vem somados pelo TabNet; o valor e uma ESTIMATIVA usando
# o codigo mais caro (VVPP com perfluorcarbono/oleo de silicone/endolaser).
# ---------------------------------------------------------------------------
vvpp:
  abrev: "VVPP"
  nome:  "Vitrectomia posterior"
  codigos: ["0405030142", "0405030169", "0405030177"]
  valor_estimado: 9403.68
  estimado: true

