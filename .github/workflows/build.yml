# Compila o Dado em Casa para Windows, macOS e Linux a cada push.
#
# Os executaveis ficam em Actions > (execucao) > Artifacts.
# Uma tag v* (ex.: git tag v0.1.0 && git push origin v0.1.0) publica tambem
# uma Release com os tres arquivos, com link direto para mandar a quem for
# jogar.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (.exe)
    # Compilacao cruzada com MinGW: um .exe unico, sem DLL alem das do sistema.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - uses: actions/upload-artifact@v4
        with:
          name: DadoEmCasa-windows
          path: build/DadoEmCasa.exe

  windows-msvc:
    name: Windows (Visual Studio)
    # So confere que o projeto tambem compila no Visual Studio.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  linux:
    name: Linux
    # 22.04: o binario roda em distros com glibc 2.35 ou mais nova.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
      - run: tar -czf DadoEmCasa-linux.tar.gz -C build DadoEmCasa
      - uses: actions/upload-artifact@v4
        with:
          name: DadoEmCasa-linux
          path: DadoEmCasa-linux.tar.gz

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
      # Assinatura ad hoc: sem ela o macOS diz que o app esta "danificado".
      - run: codesign --force --deep --sign - build/DadoEmCasa.app
      - run: ditto -c -k --keepParent build/DadoEmCasa.app DadoEmCasa-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DadoEmCasa-macos
          path: DadoEmCasa-macos.zip

  web:
    name: Navegador (versão online)
    runs-on: ubuntu-24.04
    permissions:
      contents: write                    # para publicar na branch gh-pages
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
      - run: emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-web -j
      - run: |
          mkdir -p site
          cp build-web/index.html build-web/index.js build-web/index.wasm \
             build-web/mqtt.min.js build-web/icone.png site/
          cd site && zip -r ../DadoEmCasa-web.zip .
      # Zip pronto para subir no itch.io, se preferir.
      - uses: actions/upload-artifact@v4
        with:
          name: DadoEmCasa-web
          path: DadoEmCasa-web.zip
      # Publica em https://ericzv.github.io/dices/ (ligue o Pages uma vez em
      # Settings > Pages > Deploy from a branch > gh-pages).
      - if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: true

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && zip DadoEmCasa-windows.zip DadoEmCasa.exe
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --title "Dado em Casa $GITHUB_REF_NAME" --generate-notes
          dist/DadoEmCasa-windows.zip dist/DadoEmCasa-macos.zip dist/DadoEmCasa-linux.tar.gz \
          dist/DadoEmCasa-web.zip
